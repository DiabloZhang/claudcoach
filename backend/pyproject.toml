[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
show_error_codes = true
warn_unused_ignores = true
strict_optional = true
warn_redundant_casts = true
warn_unused_configs = true
implicit_optional = true

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]
